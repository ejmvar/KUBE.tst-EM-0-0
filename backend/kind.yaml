apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joke-app
  template:
    metadata:
      labels:
        app: joke-app
    spec:
      containers:
        - name: joke-app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: joke-app
spec:
  selector:
    app: joke-app
  ports:
    - port: 80
      targetPort: 8080
