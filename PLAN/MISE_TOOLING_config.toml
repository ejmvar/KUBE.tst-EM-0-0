# ------------------------------
[settings]
activate_aggressive = true
# Keeping this false is the default;.
# set to true if you want to use features like 'mise run --watch'

experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
compile = false

[tasks.mise-install]
run="""
# https://mise.jdx.dev/getting-started.html
curl https://mise.run | sh

"""

[tasks.uv-install-deps]
run = ["uv pip install -r requirements.txt"]

[tasks.py-test]
run = ["pytest ."]

# [tasks.000-introubleReshim]
# description='''Troubleshooting
# If the command isn't recognized immediately, you might need to force mise to rescan your binaries:'''
# run = '''
# mise reshim
# mise install cargo-binstall
# mise install
# mise doctor
# '''


[tasks.000-setup-000-initial-steps]
description = "Initial bootstrap to install Rust, binstall, and cargo tools in the correct order"
run = [
  "mise install usage",                 # Add usage to properly autocomplete in shell cli
  "mise use    usage",                  # Add usage to properly autocomplete in shell cli
  "mise use -g usage",                  # Add usage to properly autocomplete in shell cli
  "mise plugin uninstall rust || true", # Remove the conflicting plugin if it exists
  "mise install rust@latest",           # Install Rust first
  "mise reshim",                        # Make 'cargo' available
  "mise install cargo-binstall",        # Install binstall for speed
  "mise install",                       # Install everything else in the config
  "mise reshim",                        # Final sync
  "echo '✅ Environment setup complete!'",
  "mise ls",
  "mise doctor"
]


[tasks.000-setup-01-completion]
description = "Add competion for bash shell"
run = [
  "mkdir -p ~/.local/share/bash-completion/completions/",
  "mise completion bash --include-bash-completion-lib > ~/.local/share/bash-completion/completions/mise",
# "eval "$(/home/qq/.local/bin/mise activate bash)", # added by https://mise.run/bash
  "echo 'eval \"$(mise activate bash)\"' >> ~/.bashrc",
  "source ~/.bashrc",
  "echo Try:    mise r TAB",
  "echo Maybe: source ~/.bashrc",
]



