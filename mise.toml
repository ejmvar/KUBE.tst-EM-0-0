[tools]
# Python is provided by uv so the free-threaded build can be used.

# mise settings set python.compile=false
#python = "3.14t"
uv = "latest"
cmake = "3.30"
ninja = "1.12"
ccache = "latest"
usage = "latest"
shellcheck = "latest"
#terraform = "latest"

# ### KIND + KUBERNETES ### #

"cargo:worktrunk" = "latest"
#"cargo" = "latest"


# ------------------------------

# ::::::::::::::::::::::::::::::

# hunk PR s diff management
#https://github.com/modem-dev/hunk
#"node:npm i -g hunkdiff"
"npm:hunkdiff" = "latest"
herdr = "latest"
# ["npm:hunk"] = "latest"
# # ["pnpm:hunk"] = "latest"
# # ["pnpm:hunkdiff"] = "latest"
# # # ["pnpm:defuddle"] = "latest"
# # # ["pnpm:defuddle"] = "latest"
# # # ["pnpm:defuddle"] = "latest"

# ------------------------------
# npm install -g agent-browser
"npm:agent-browser" = "latest"
chezmoi = "2.73.3"
fastfetch = "latest"




k3sup = "latest"
kustomize = "latest"
# opentofu  OpenTofu lets you declaratively manage your cloud infrastructure. https://github.com/opentofu/opentofu
opentofu = "latest"
k0sctl = "latest"
# then run: 
# agent-browser install --with-deps



# https://mise.jdx.dev/registry.html
kuttl = "latest"
kubectl-kuttl = "latest"
"kind" = "latest"
# "aqua:kudobuilder/kuttl" = "latest"
minikube="latest"
# https://github.com/kubernetes/kubernetes
"kubectl"="latest"
helm = "latest"
# https://github.com/jonashackt/crossplane-kuttl
timoni = { version = "latest", workflow = "release.yaml" }
krew = "latest"
# cue                       The home of the CUE language! Validate and define text-based and dynamic configuration. https://github.com/cue-lang/cue
cue = "latest"
# k9s   Kubernetes CLI To Manage Your Clusters In Style. https://github.com/derailed/k9s
k9s = "latest"

# stern                    ⎈ Multi pod and container log tailing for Kubernetes -- Friendly fork of https://github.com/wercker/stern. https://github.com/stern/stern
stern = "latest"

# kubie                      A more powerful alternative to kubectx and kubens. https://github.com/kubie-org/kubie
kubie = "latest"


